# StörDesk — full stack.
#
# Everything is configured through `.env` (create it with `npm run env:create`).
# This file never has to be edited for a deployment.
#
#   docker compose up -d --build                 # core stack (db, api, web)
#   docker compose --profile backup up -d       # + periodic database dumps and uploads archives
#
# Profiles are independent and can be combined.

name: ${COMPOSE_PROJECT_NAME:-stoerdesk}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # One-shot dump before the API applies pending migrations (WP-M3-17). The
  # `api` service waits for this container to finish successfully, so a broken
  # migration can never run on a database without a fresh dump. No profile:
  # the gate stays active when the periodic `backup` profile is switched off.
  db-backup-pre-migrate:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
        dump="/backups/.pre-migrate-$$stamp.sql"
        tmp="/backups/pre-migrate-$$stamp.sql.gz.tmp"
        out="/backups/pre-migrate-$$stamp.sql.gz"
        trap 'rm -f "$$dump" "$$tmp"' EXIT
        echo "writing pre-migration backup $$out"
        PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump \
          --host=db --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" \
          --file="$$dump"
        test -s "$$dump"
        gzip -c "$$dump" > "$$tmp"
        gzip -t "$$tmp"
        mv "$$tmp" "$$out"
        find /backups -name 'pre-migrate-*.sql.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Applies pending Drizzle migrations at start (Dockerfile CMD), then serves.
  api:
    build:
      context: ${IMAGE_BUILD_CONTEXT:-.}
      target: api
      args:
        # The commit the image is built from; the API compares it with the
        # newest commit of the branch (specs/18-self-update.md §18.3).
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: stoerdesk-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # The API runs behind the nginx reverse proxy of the web container.
      TRUST_PROXY: 'true'
      # The connection parts are passed instead of a URL: the API encodes the
      # credentials, so a password with special characters works.
      DATABASE_HOST: db
      # The .env file of the host points at localhost; the container uses the parts above.
      DATABASE_URL: ''
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-stoerdesk}
      DATABASE_USER: ${POSTGRES_USER:-stoerdesk}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is missing - run "npm run env:create"}
      COOKIE_SECURE: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3080}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # The update control (ADR-0007): the API checks GitHub for a newer commit
      # and starts the deployment through the webhook. The tokens stay in this
      # container; they are never sent to the browser and never logged.
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-}
      UPDATE_WEBHOOK_TOKEN: ${UPDATE_WEBHOOK_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
      db-backup-pre-migrate:
        condition: service_completed_successfully
    # No published host port: `web` reaches the API over the internal `backend`
    # network (API_UPSTREAM). Direct access for curl/monitoring is opt-in with
    # docker-compose.debug.yml.
    expose:
      - '${API_PORT:-3000}'
    # A deploy hook that runs on the host of the stack is reachable under this
    # name (specs/18-self-update.md §18.5).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  web:
    build:
      context: ${IMAGE_BUILD_CONTEXT:-.}
      target: web
    image: stoerdesk-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:${API_PORT:-3000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # Only substitute API_* and UPLOAD_* variables in the nginx template,
      # never nginx variables such as $host or $remote_addr.
      NGINX_ENVSUBST_FILTER: ^(API|UPLOAD)_
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3080}:80'
    # Intentionally independent of the API: nginx resolves the API per request,
    # so the UI is reachable while the API is starting or temporarily down.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Periodic database dumps and uploads archives into the backup volume (profile "backup").
  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles:
      - backup
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          echo "writing backup $$stamp"
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump \
            --host=db --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" \
            | gzip > "/backups/stoerdesk-$$stamp.sql.gz"
          tar -czf "/backups/stoerdesk-$$stamp-uploads.tar.gz" -C /data/uploads .
          find /backups -name 'stoerdesk-*.sql.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          find /backups -name 'stoerdesk-*.tar.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - backups:/backups
      # Read-only: the backup only tars the photos, it never writes into them.
      - uploads:/data/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

volumes:
  # Postgres data (survives `docker compose down`).
  pgdata:
    name: ${PGDATA_VOLUME:-stoerdesk_pgdata}
  # Uploaded photos of the report form.
  uploads:
    name: ${UPLOADS_VOLUME:-stoerdesk_uploads}
  # Compressed database dumps and uploads archives.
  backups:
    name: ${BACKUP_VOLUME:-stoerdesk_backups}

networks:
  # Database, API and web frontend.
  backend: {}
