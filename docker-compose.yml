# StörDesk — full stack.
#
# Everything is configured through `.env` (create it with `npm run env:create`).
# This file never has to be edited for a deployment.
#
#   docker compose up -d --build                 # core stack (db, api, web)
#   docker compose --profile backup up -d       # + periodic database dumps
#   docker compose --profile update up -d update-agent  # + host update agent
#
# Profiles are independent and can be combined.

name: ${COMPOSE_PROJECT_NAME:-stoerdesk}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Applies pending Drizzle migrations at start (Dockerfile CMD), then serves.
  api:
    build:
      context: ${IMAGE_BUILD_CONTEXT:-.}
      target: api
    image: stoerdesk-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # The API runs behind the nginx reverse proxy of the web container.
      TRUST_PROXY: 'true'
      # The connection parts are passed instead of a URL: the API encodes the
      # credentials, so a password with special characters works.
      DATABASE_HOST: db
      # The .env file of the host points at localhost; the container uses the parts above.
      DATABASE_URL: ''
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-stoerdesk}
      DATABASE_USER: ${POSTGRES_USER:-stoerdesk}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is missing - run "npm run env:create"}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3080}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # The host update agent (profile "update"). Without a token the API
      # answers that the agent is not configured; the token is never logged.
      UPDATE_AGENT_URL: ${UPDATE_AGENT_URL:-http://update-agent:8080}
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
    # No published host port: `web` reaches the API over the internal `backend`
    # network (API_UPSTREAM). Direct access for curl/monitoring is opt-in with
    # docker-compose.debug.yml.
    expose:
      - '${API_PORT:-3000}'
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  web:
    build:
      context: ${IMAGE_BUILD_CONTEXT:-.}
      target: web
    image: stoerdesk-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:${API_PORT:-3000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # Only substitute API_* and UPLOAD_* variables in the nginx template,
      # never nginx variables such as $host or $remote_addr.
      NGINX_ENVSUBST_FILTER: ^(API|UPLOAD)_
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3080}:80'
    # Intentionally independent of the API: nginx resolves the API per request,
    # so the UI is reachable while the API is starting or temporarily down.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Periodic database dumps into the backup volume (profile "backup").
  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles:
      - backup
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          echo "writing backup $$stamp"
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump \
            --host=db --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" \
            | gzip > "/backups/stoerdesk-$$stamp.sql.gz"
          find /backups -name 'stoerdesk-*.sql.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Host update agent (profile "update"): pulls the repository, rebuilds the
  # stack and prunes the old images (ADR-0006).
  #
  # The profile keeps the agent out of a plain `docker compose up -d --build`,
  # so the agent is never recreated by the redeploy it triggers itself. It is
  # started explicitly:
  #
  #   docker compose --profile update up -d update-agent
  #
  # The agent listens only on the internal `backend` network and answers only
  # with the bearer UPDATE_AGENT_TOKEN. It has no published host port.
  update-agent:
    build:
      context: ${IMAGE_BUILD_CONTEXT:-.}
      target: agent
    image: stoerdesk-agent:latest
    profiles:
      - update
    restart: unless-stopped
    environment:
      # The bearer of the agent. An empty value stops the agent with a clear
      # message instead of starting it without a secret.
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      UPDATE_AGENT_PORT: ${UPDATE_AGENT_PORT:-8080}
      # The checkout of the host is mounted read-write: the agent pulls it and
      # the compose client of the agent reads the build context from it.
      UPDATE_AGENT_CHECKOUT: /repo
      UPDATE_AGENT_PROJECT_DIR: /repo
      UPDATE_AGENT_COMPOSE_FILE: /repo/docker-compose.yml
      UPDATE_AGENT_STATE_DIR: /state
    volumes:
      - .:/repo
      # The Docker socket is the only host privilege of the agent.
      - /var/run/docker.sock:/var/run/docker.sock
      - update-state:/state
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

volumes:
  # Postgres data (survives `docker compose down`).
  pgdata:
    name: ${PGDATA_VOLUME:-stoerdesk_pgdata}
  # Uploaded photos of the report form.
  uploads:
    name: ${UPLOADS_VOLUME:-stoerdesk_uploads}
  # Compressed database dumps.
  backups:
    name: ${BACKUP_VOLUME:-stoerdesk_backups}
  # The last run of the update agent.
  update-state:
    name: ${UPDATE_STATE_VOLUME:-stoerdesk_update_state}

networks:
  # Database, API and web frontend.
  backend: {}
