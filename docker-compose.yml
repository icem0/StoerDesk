# StörDesk — full stack.
#
# Everything is configured through `.env` (create it with `npm run env:create`).
# This file never has to be edited for a deployment.
#
#   docker compose up -d --build                 # core stack (db, migrate, api, web)
#   docker compose --profile notifications up -d # + ntfy
#   docker compose --profile signal up -d       # + signal-cli bridge
#   docker compose --profile matrix up -d       # + Matrix homeserver
#   docker compose --profile backup up -d       # + periodic database dumps
#
# Profiles are independent and can be combined.

name: ${COMPOSE_PROJECT_NAME:-stoerdesk}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Applies the Drizzle migrations once, before the API starts.
  migrate:
    build:
      context: ${BUILD_CONTEXT:-.}
      target: api
    restart: 'no'
    command: ['node', 'apps/api/dist/db/migrate.js']
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-stoerdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stoerdesk}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  api:
    build:
      context: ${BUILD_CONTEXT:-.}
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # The API runs behind the nginx reverse proxy of the web container.
      TRUST_PROXY: 'true'
      DATABASE_URL: postgres://${POSTGRES_USER:-stoerdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stoerdesk}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is missing - run "npm run env:create"}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  web:
    build:
      context: ${BUILD_CONTEXT:-.}
      target: web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:${API_PORT:-3000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # Only substitute API_* and UPLOAD_* variables in the nginx template,
      # never nginx variables such as $host or $remote_addr.
      NGINX_ENVSUBST_FILTER: ^(API|UPLOAD)_
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend
      - frontend

  # Push notifications via ntfy (profile "notifications").
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:latest}
    profiles:
      - notifications
    restart: unless-stopped
    command: ['serve']
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost:2586}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      NTFY_BEHIND_PROXY: 'true'
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ntfy-cache:/var/lib/ntfy
    ports:
      - '${NTFY_PORT:-2586}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend
      - frontend

  # Signal bridge (profile "signal").
  #
  # signal-cli speaks JSON-RPC over HTTP; the API posts to
  # ${SIGNAL_CLI_URL}/api/v1/rpc. The number has to be registered once:
  #   docker compose --profile signal run --rm signal-cli -a +49... register
  signal-cli:
    image: ${SIGNAL_CLI_IMAGE:-ghcr.io/asamk/signal-cli:latest}
    profiles:
      - signal
    restart: unless-stopped
    command: ['-a', '${SIGNAL_SOURCE_NUMBER:-}', 'daemon', '--http=0.0.0.0:8080']
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - signal-data:/var/lib/signal-cli
    ports:
      - '${SIGNAL_CLI_PORT:-8080}:8080'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

  # Matrix homeserver (profile "matrix").
  #
  # The notification bot is created with `npm run matrix:create-bot`, which
  # prints MATRIX_ACCESS_TOKEN and MATRIX_ROOM_ID for the .env file.
  matrix:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    profiles:
      - matrix
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-matrix.localhost}
      SYNAPSE_REPORT_STATS: 'no'
      SYNAPSE_ENABLE_REGISTRATION: 'false'
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET:-}
      SYNAPSE_NO_TLS: 'true'
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - matrix-data:/data
    ports:
      - '${MATRIX_PORT:-8008}:8008'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions',timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend
      - frontend

  # Periodic database dumps into the backup volume (profile "backup").
  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles:
      - backup
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          echo "writing backup $$stamp"
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump \
            --host=db --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" \
            | gzip > "/backups/stoerdesk-$$stamp.sql.gz"
          find /backups -name 'stoerdesk-*.sql.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run "npm run env:create"}
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend

volumes:
  # Postgres data (survives `docker compose down`).
  pgdata:
    name: ${PGDATA_VOLUME:-stoerdesk_pgdata}
  # Uploaded photos of the report form.
  uploads:
    name: ${UPLOADS_VOLUME:-stoerdesk_uploads}
  # ntfy message cache.
  ntfy-cache:
    name: ${NTFY_DATA_VOLUME:-stoerdesk_ntfy}
  # signal-cli account data (keys of the registered number).
  signal-data:
    name: ${SIGNAL_DATA_VOLUME:-stoerdesk_signal}
  # Synapse homeserver: database, media store, signing key.
  matrix-data:
    name: ${MATRIX_DATA_VOLUME:-stoerdesk_matrix}
  # Compressed database dumps.
  backups:
    name: ${BACKUP_VOLUME:-stoerdesk_backups}

networks:
  # Database, API and notification bridges.
  backend: {}
  # Services that are published to the host.
  frontend: {}
