name: stoerdesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stoerdesk}
      POSTGRES_USER: ${POSTGRES_USER:-stoerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ist zu setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stoerdesk} -d ${POSTGRES_DB:-stoerdesk}']
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - '5432'

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-stoerdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stoerdesk}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET ist zu setzen}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      UPLOAD_DIR: /data/uploads
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  ntfy:
    image: binwiederhier/ntfy:latest
    profiles:
      - notifications
    restart: unless-stopped
    command: ['serve', '--base-url', 'http://localhost:2586']
    ports:
      - '${NTFY_PORT:-2586}:80'

volumes:
  pgdata:
  uploads:
