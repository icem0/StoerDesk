name: publish images

# The `check` run of a version tag push is titled `v0.0.NN` and this workflow inherits
# that title, so an automatic publish run starts as `publish v0.0.NN`. A run name can
# never be changed after the start - GitHub has no REST endpoint for it - so the version
# has to come from the payload of the calling run (WP-M1-10h).
# GitHub Actions expressions have no substring(), so no short SHA ever fits a label.
# One line on purpose: a folded scalar would keep the newlines of deeper-indented
# continuation lines and put them into the label.
run-name: ${{ github.event_name == 'workflow_run' && format('publish {0}', github.event.workflow_run.display_title) || format('publish images · dispatch · {0} · {1}', github.ref_name, github.event.inputs.version) }}

on:
  # No branch filter: the calling `check` run comes from a version tag push, whose source
  # ref is the tag, not `main`. The version job gates on the trigger event of that run,
  # so a finished pull request run never publishes.
  workflow_run:
    workflows: ['check']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.0.32
        required: true
        type: string

# The publish run only reads the repository and writes packages: the run label is
# already correct when the run starts, because the version is inherited from the
# calling `check` run or given by the `version` input of a dispatch run.
permissions:
  contents: read
  packages: write

# One global publish queue: consecutive pushes would otherwise build images in
# parallel and a slower run of an older commit could overwrite `latest`
# afterwards. Runs queue behind each other (max two waiting), never cancel.
concurrency:
  group: publish-queue
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Resolve version tag
    # Only the check run of a version tag push publishes: `workflow_run` fires for every
    # completed run of the `check` workflow, pull request runs included.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: version
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "No vMAJOR.MINOR.PATCH tag at HEAD." >&2
            echo "Commit with the Husky hook and push with: git push --follow-tags" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }} image ${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/stoerdesk-${SERVICE}"
          {
            echo "tags<<TAGS"
            echo "${image}:${VERSION}"
            echo "${image}:${TAG}"
            echo "${image}:sha-${SHA}"
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=StoerDesk ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Every publish run states in its job summary which images exist now, so the
      # run list plus the summary answers "which version produced which image".
      - name: Write image summary
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
          SOURCE_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          source_run="${SOURCE_RUN:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          {
            echo "## ${SERVICE} image ${VERSION}"
            echo ""
            echo "- source SHA: \`${SHA}\`"
            echo "- source run: <${source_run}>"
            echo "- published tags:"
            while IFS= read -r line; do
              echo "  - \`${line}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
