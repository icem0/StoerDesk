name: publish images

# The resolved version is unknown when the run starts, so this label carries the
# trigger and the source branch; the `Resolve version tag` job renames the run to
# `publish <version> · <short sha>` as soon as the tag is known.
run-name: >-
  publish images · ${{ github.event_name }} ·
  ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  · ${{ github.event_name == 'workflow_run' && substring(github.event.workflow_run.head_sha, 0, 7) || substring(github.sha, 0, 7) }}

on:
  workflow_run:
    workflows: ['check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.0.32
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Resolve version
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: version
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "No vMAJOR.MINOR.PATCH tag at HEAD." >&2
            echo "Commit with the Husky hook and push with: git push --follow-tags" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }} image
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/stoerdesk-${SERVICE}"
          {
            echo "tags<<TAGS"
            echo "${image}:${VERSION}"
            echo "${image}:${TAG}"
            echo "${image}:sha-${SHA}"
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=StoerDesk ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
