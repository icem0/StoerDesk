name: publish images

# A run name is fixed when the run starts and can never be changed afterwards, and the
# only event payload that carries usable free text is a `workflow_dispatch` input: a tag
# push payload carries the whole multiline commit message, a `workflow_run` payload only
# the title of the calling run. So the green `check` run of a version tag push dispatches
# this workflow itself (its job `Dispatch publish run`) and hands over the version plus the
# commit subject as the one line of "what is new" - that run is titled
# `publish v0.0.NN · <commit subject>`. A manual run leaves `notes` empty and titles itself
# `publish <version> · manual · <ref>` (WP-M1-10i).
# One line on purpose: a folded scalar would keep the newlines of deeper-indented
# continuation lines and put them into the label.
# The image tags of a run are the version tags of that commit. `latest` is not one of
# them: a separate promotion step points it at the newest version that exists in the
# registry, so `latest` never depends on which build finished last.
run-name: ${{ github.event.inputs.notes != '' && format('publish {0} · {1}', github.event.inputs.version, github.event.inputs.notes) || format('publish {0} · {1} · {2}', github.event.inputs.version, github.event.inputs.mode, github.ref_name) }}

on:
  # Reached from two directions: the `check` run of a version tag push dispatches with
  # `mode=check` and the version of that tag, a person dispatches with `mode=manual`.
  # `mode` only records who authorised the run; every publish run publishes its own
  # version tags and promotes `latest` to the newest published version.
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.0.32
        required: true
        type: string
      notes:
        description: One line about what is new - only used for the run label
        required: false
        default: ''
      source_run:
        description: URL of the check run that dispatched this run
        required: false
        default: ''
      mode:
        description: Who authorised this publish
        required: true
        type: choice
        options:
          - manual
          - check
        default: manual

# The publish run only reads the repository and writes packages: the run label is
# already correct when the run starts, because the version and the note arrive as the
# `version` and `notes` inputs of the dispatch that started it.
permissions:
  contents: read
  packages: write

# One group per version. A shared group was wrong: GitHub keeps only one pending
# run per group and cancels the previous pending one when a new run is queued, so
# a batch of dispatches lost the runs in between (`publish v0.0.87` and
# `publish v0.0.97` were cancelled and their images were never built). With one
# group per version no run can cancel another, and `latest` is no longer written
# by the build but promoted afterwards (see the promotion step in the publish
# job), so the order of the runs does not matter.
concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Resolve version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "No vMAJOR.MINOR.PATCH tag at HEAD." >&2
            echo "Commit with the Husky hook and push with: git push --follow-tags" >&2
            exit 1
          fi
          if [ "$version" != "$REQUESTED" ]; then
            echo "Requested $REQUESTED, but that commit carries $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }} image ${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/stoerdesk-${SERVICE}"
          {
            echo "tags<<TAGS"
            echo "${image}:${VERSION}"
            echo "${image}:${TAG}"
            echo "${image}:sha-${SHA}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=StoerDesk ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Every publish run states in its job summary which images exist now and which line
      # of "what is new" its label carries, so the run list plus the summary answers
      # "which version produced which image".
      - name: Write image summary
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
          MODE: ${{ github.event.inputs.mode }}
          NOTES: ${{ github.event.inputs.notes }}
          SOURCE_RUN: ${{ github.event.inputs.source_run }}
        run: |
          set -euo pipefail
          source_run="${SOURCE_RUN:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          {
            echo "## ${SERVICE} image ${VERSION}"
            echo ""
            if [ -n "${NOTES}" ]; then
              echo "- what is new: ${NOTES}"
            fi
            echo "- published by: \`${MODE:-manual}\`"
            echo "- source SHA: \`${SHA}\`"
            echo "- source run: <${source_run}>"
            echo "- published tags:"
            while IFS= read -r line; do
              echo "  - \`${line}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # `latest` must name the newest published version, not the version whose build
  # happened to finish last. The promotion reads the registry, takes the highest version
  # tag that really exists there and points `latest` at that manifest.
  #
  # Promotion waits for a successful publish of both images: a failed api build must
  # not leave `latest` with a new web image and an old api image.
  #
  # The promotions of one image are serialised: the group is per image, so the read of
  # the registry and the write of `latest` never interleave with another promotion of
  # the same image and `latest` can only move forward. The api image and the web image
  # have their own group, so they never wait for each other.
  promote:
    name: Promote latest for ${{ matrix.service }}
    needs: [version, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: latest-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest to the newest published version
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/stoerdesk-${SERVICE}"
          newest=""
          for tag in $(git tag --list --sort=-v:refname 'v[0-9]*'); do
            if docker buildx imagetools inspect "${image}:${tag}" >/dev/null 2>&1; then
              newest="$tag"
              break
            fi
          done
          if [ -z "$newest" ]; then
            echo "No published version of ${image} found in the registry." >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${image}:latest" "${image}:${newest}"
          {
            echo "## latest of ${SERVICE}"
            echo ""
            echo "- version: \`${VERSION}\`"
            echo "- \`latest\`: \`${image}:latest\` -> \`${newest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The redeploy is a host concern (`docs/DEPLOYMENT.md`): the documented receiver is
  # `POST <webhook>` with `X-Deploy-Token` and ignores the body. The job only runs after
  # both images were published and promoted, and only for the highest version tag, so a
  # late older run cannot overwrite a newer deployment. A missing webhook is a notice,
  # not a red run: a deployment without a redeploy target stays valid.
  deploy:
    name: Deploy ${{ needs.version.outputs.version }}
    needs: [version, publish, promote]
    if: ${{ needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Deploy the promoted version
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail

          summary() {
            {
              echo "## Deploy ${VERSION}"
              echo ""
              echo "- version: \`${VERSION}\`"
              echo "- HTTP status: ${1}"
              echo "- result: ${2}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            summary "n/a" "skipped, DEPLOY_WEBHOOK_URL is not configured"
            exit 0
          fi

          if [ -z "${DEPLOY_WEBHOOK_SECRET}" ]; then
            summary "n/a" "skipped, DEPLOY_WEBHOOK_SECRET is not configured"
            exit 0
          fi

          newest=$(git tag --list --sort=-v:refname 'v[0-9]*' | head -n 1)
          if [ "${VERSION}" != "${newest}" ]; then
            summary "n/a" "skipped, newer version exists (${newest})"
            exit 0
          fi

          body=$(jq -cn --arg version "${VERSION}" --arg sha "${SHA}" '{version: $version, sha: $sha}')
          signature=$(printf '%s' "${body}" | openssl dgst -sha256 -hmac "${DEPLOY_WEBHOOK_SECRET}" -hex | awk '{print $NF}')

          status=000
          if ! status=$(curl --fail --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST "${DEPLOY_WEBHOOK_URL}" \
            --header 'content-type: application/json' \
            --header "X-Signature-256: sha256=${signature}" \
            --header "X-Deploy-Token: ${DEPLOY_WEBHOOK_SECRET}" \
            --data "${body}"); then
            summary "${status:-000}" "failed"
            exit 1
          fi

          summary "${status}" "deployed"
