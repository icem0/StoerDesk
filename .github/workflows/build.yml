name: publish images

# The resolved version is unknown when the run starts, so this label carries the
# trigger and the source branch of the calling `check` run. GitHub Actions has no
# substring() function, so no short SHA here; the still open
# `Resolve version tag` step renames the run to `publish <version>` as soon as the tag
# is known (WP-M1-10f).
run-name: publish images · ${{ github.event_name }} · ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

on:
  workflow_run:
    workflows: ['check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v0.0.32
        required: true
        type: string

# `actions: write` lets the version job rename the run to `publish <version>`;
# the rename step is `continue-on-error: true`, so a missing scope never breaks
# the publish (WP-M1-10f).
permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-and-push-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Resolve version tag
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: version
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "No vMAJOR.MINOR.PATCH tag at HEAD." >&2
            echo "Commit with the Husky hook and push with: git push --follow-tags" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The run label cannot carry the version when the run starts, so the
      # resolved tag is written into the run name here. Guarded, because a
      # missing `actions: write` scope must never break the publish.
      - name: Name the run after the version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: publish ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f name="$RUN_LABEL"

  publish:
    name: Publish ${{ matrix.service }} image ${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/stoerdesk-${SERVICE}"
          {
            echo "tags<<TAGS"
            echo "${image}:${VERSION}"
            echo "${image}:${TAG}"
            echo "${image}:sha-${SHA}"
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=StoerDesk ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Every publish run states in its job summary which images exist now, so the
      # run list plus the summary answers "which version produced which image".
      - name: Write image summary
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
          SOURCE_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          source_run="${SOURCE_RUN:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          {
            echo "## ${SERVICE} image ${VERSION}"
            echo ""
            echo "- source SHA: \`${SHA}\`"
            echo "- source run: <${source_run}>"
            echo "- published tags:"
            while IFS= read -r line; do
              echo "  - \`${line}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
