name: check

# The quality gates hang on the version tag: `git push --follow-tags` pushes the commit
# and its annotated tag, and the tag push starts this run. A run name can never be
# changed after the start (GitHub has no REST endpoint for it), so the version has to be
# in the label from the first second - the tag ref is the only place where the event
# payload carries it. GitHub Actions expressions have no substring(), so no short SHA
# ever fits a label.
# The publish run no longer inherits this title: a `workflow_run` payload only carries the
# title of the calling run, so it could never say more than `publish v0.0.NN`. This run
# dispatches `build.yml` itself and hands the version plus one line of "what is new" over
# as `workflow_dispatch` inputs - the only payload that carries usable free text (WP-M1-10i).
run-name: ${{ github.event_name == 'pull_request' && format('check · {0} · pull_request', github.head_ref) || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint, Tests, i18n
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoerdesk
          POSTGRES_PASSWORD: ci-stoerdesk
          POSTGRES_DB: stoerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoerdesk -d stoerdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The run title of a tag push is the bare version (`v0.0.NN`), because the push
      # payload carries no usable one-line commit subject. The summary resolves the
      # run to its commit and its work package.
      - name: Record the release context in the run summary
        run: |
          {
            echo "## ${GITHUB_REF_NAME}"
            echo ""
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- subject: $(git log -1 --pretty=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: npm ci

      # WP-M1-12: the last gate of `npm run check` is the Playwright smoke test, so the
      # browser belongs into this job — it already provides the Postgres-16 service whose
      # account the E2E runner uses to create its own throwaway database.
      # `--with-deps` installs the browser through apt, and apt reaches the Ubuntu
      # package mirrors over the network of the runner: a mirror that cannot be resolved
      # ("Temporary failure resolving 'azure.archive.ubuntu.com'", apt exit 100,
      # "Failed to install browsers") is an infrastructure failure, not a code failure —
      # that is what cost the versions v1.1.2 … v1.1.7 their check run (ADR-0018).
      # Acquire::Retries recovers a single download, the loop repeats the whole install and
      # the last resort takes the browser alone from the Playwright CDN and says so in the
      # run summary. Nothing is skipped: a browser that still cannot be installed fails the
      # job, the run stays red and no publish run is dispatched for that version, and
      # `scripts/e2e-check.mjs` refuses to run the tests in CI against a browser that does
      # not start (PLAN.md §18.2).
      - name: Install Chromium for the E2E smoke test
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/90-stoerdesk-ci >/dev/null <<'APT'
          Acquire::Retries "4";
          Acquire::http::Timeout "20";
          Acquire::ftp::Timeout "20";
          DPkg::Lock::Timeout "120";
          APT
          for attempt in 1 2; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Browser install through apt failed (attempt $attempt/2) - the runner package mirror is unreachable."
            [ "$attempt" = 2 ] || sleep 30
          done
          if timeout 300 npx playwright install chromium; then
            {
              echo "## Chromium without browser dependencies"
              echo ""
              echo "- reason: the Ubuntu package mirror of the runner stayed unreachable through both apt attempts"
              echo "- effect: the E2E smoke test runs the bundled Chromium of the Playwright CDN without the apt dependency packages - this run proves the app, not the dependency install (ADR-0018)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "No Chromium from apt and none from the Playwright CDN - the E2E gate has no browser." >&2
          exit 1

      - name: Quality gates (typecheck, lint, tests, i18n, wp, e2e)
        run: npm run check
        env:
          # The database integration tests need a reachable PostgreSQL 16; the
          # account may create its own throwaway databases (see PLAN.md §18.2).
          TEST_DATABASE_URL: postgres://stoerdesk:ci-stoerdesk@localhost:5432/stoerdesk

      - name: Build web and API artifacts (no publish)
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The smoke test is part of the gate. GitHub-hosted runners provide Docker;
      # a runner without it cannot prove the stack, so that is a failed prerequisite,
      # never a silent skip that lets `Dispatch publish run` continue.
      - name: Detect Docker
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          else
            echo 'No usable Docker on this runner - the Docker smoke test cannot be skipped.' >&2
            exit 1
          fi

      - name: Smoke test
        run: sh scripts/docker-smoke.sh

  # Every gate of this workflow has to be listed in `needs`: this job is the only way a
  # publish run ever starts, and it only ever starts for a version tag push whose gates
  # were green. The label of that publish run is decided by the inputs handed over here,
  # because a run name is fixed when its run starts (WP-M1-10i).
  publish-dispatch:
    name: Dispatch publish run
    runs-on: ubuntu-latest
    needs: [check, docker-smoke]
    if: ${{ github.event_name == 'push' && needs.check.result == 'success' && needs.docker-smoke.result == 'success' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and one-line note
        id: note
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ "$version" != "$REF" ]; then
            echo "Tag $REF does not point at $(git rev-parse --short HEAD)." >&2
            echo "Commit with the Husky hook and push with: git push --follow-tags" >&2
            exit 1
          fi
          # The commit subject is the one line of "what is new": one work package per
          # commit makes it a Conventional Commit subject, never longer than the
          # commitlint header limit and never multiline.
          note=$(git log -1 --pretty=%s | tr -d '\r\n' | cut -c1-72)
          if [ -z "$note" ]; then
            echo "Commit $(git rev-parse --short HEAD) has no subject." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "note=$note"
          } >>"$GITHUB_OUTPUT"

      - name: Start the publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.note.outputs.version }}
          NOTES: ${{ steps.note.outputs.note }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -cn \
            --arg ref "$VERSION" \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg source_run "$SOURCE_RUN" \
            '{ref: $ref, inputs: {version: $version, notes: $notes, source_run: $source_run, mode: "check"}}' |
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
              --input -

      - name: Document the dispatch in the run summary
        env:
          VERSION: ${{ steps.note.outputs.version }}
          NOTES: ${{ steps.note.outputs.note }}
        run: |
          set -euo pipefail
          {
            echo "## Publish run dispatched"
            echo ""
            echo "- version: \`${VERSION}\`"
            echo "- run label: \`publish ${VERSION} · ${NOTES}\`"
            echo "- inputs: \`mode=check\`, \`version=${VERSION}\`, \`notes=${NOTES}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # The Playwright smoke test of WP-M1-12 runs inside the `check` job, not in a job of its
  # own: it needs the same Postgres-16 service, and `npm run test:e2e` is the last gate of
  # `npm run check`, so one job carries both prerequisites and the publish chain above
  # needs nothing new. The runner creates a throwaway database per run and skips with one
  # notice when a prerequisite is missing — in CI nothing is missing, so the two E2E tests
  # really run here.
