name: check

# Every run says what it checks: branch or PR and the trigger. GitHub Actions has no
# substring() function, so the SHA is not part of the label — the run list already
# shows the commit and its subject names the work package.
run-name: >-
  check · ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  · ${{ github.event_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint, Tests, i18n
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoerdesk
          POSTGRES_PASSWORD: ci-stoerdesk
          POSTGRES_DB: stoerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoerdesk -d stoerdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality gates (typecheck, lint, tests, i18n, wp)
        run: npm run check
        env:
          # The database integration tests need a reachable PostgreSQL 16; the
          # account may create its own throwaway databases (see AGENTS.md).
          TEST_DATABASE_URL: postgres://stoerdesk:ci-stoerdesk@localhost:5432/stoerdesk

      - name: Build web and API artifacts (no publish)
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners provide Docker; self-hosted ones might not.
      - name: Detect Docker
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          else
            echo 'available=false' >>"$GITHUB_OUTPUT"
            echo 'No usable Docker on this runner - skipping the smoke test.'
          fi

      - name: Smoke test
        if: steps.docker.outputs.available == 'true'
        run: sh scripts/docker-smoke.sh

  # No Playwright job yet: the repository has no playwright.config and no E2E
  # specs. The former `playwright` job only re-ran the web unit tests with an
  # installed Chromium, so it was pure CI minutes. It comes back with the first
  # real E2E work package (WP-M1-11/WP-M1-12).
