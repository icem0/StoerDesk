name: check

# Every run says what it checks: branch or PR and the trigger. GitHub Actions has no
# substring() function, so the SHA is not part of the label — the run list already
# shows the commit and its subject names the work package. On `main` the job
# `Resolve version tag` replaces this label with the version tag of the commit, and
# the publish workflow inherits that label (WP-M1-10g).
run-name: >-
  check · ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  · ${{ github.event_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# `actions: write` lets the version job rename this run to its version tag. A
# `push`-triggered run gets a writable GITHUB_TOKEN, unlike the `workflow_run`
# triggered publish workflow, which inherits the version from this run's label.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version tag
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Every commit of this repository carries one version tag (Husky hook), so the
      # run of that commit is named after it. GitHub Actions expressions have no
      # substring(), so the tag cannot be read out of the context - it is resolved
      # with git here. Without a tag the plain label stays.
      - name: Name the run after the version tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "No vMAJOR.MINOR.PATCH tag at HEAD - keeping the plain run label."
            exit 0
          fi
          gh api --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f name="$version"

  check:
    name: Typecheck, Lint, Tests, i18n
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoerdesk
          POSTGRES_PASSWORD: ci-stoerdesk
          POSTGRES_DB: stoerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoerdesk -d stoerdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality gates (typecheck, lint, tests, i18n, wp)
        run: npm run check
        env:
          # The database integration tests need a reachable PostgreSQL 16; the
          # account may create its own throwaway databases (see AGENTS.md).
          TEST_DATABASE_URL: postgres://stoerdesk:ci-stoerdesk@localhost:5432/stoerdesk

      - name: Build web and API artifacts (no publish)
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners provide Docker; self-hosted ones might not.
      - name: Detect Docker
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          else
            echo 'available=false' >>"$GITHUB_OUTPUT"
            echo 'No usable Docker on this runner - skipping the smoke test.'
          fi

      - name: Smoke test
        if: steps.docker.outputs.available == 'true'
        run: sh scripts/docker-smoke.sh

  # No Playwright job yet: the repository has no playwright.config and no E2E
  # specs. The former `playwright` job only re-ran the web unit tests with an
  # installed Chromium, so it was pure CI minutes. It comes back with the first
  # real E2E work package (WP-M1-11/WP-M1-12).
