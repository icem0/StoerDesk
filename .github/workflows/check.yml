name: check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint, Tests, i18n
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoerdesk
          POSTGRES_PASSWORD: ci-stoerdesk
          POSTGRES_DB: stoerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoerdesk -d stoerdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check
        env:
          # The database integration tests need a reachable PostgreSQL 16; the
          # account may create its own throwaway databases (see AGENTS.md).
          TEST_DATABASE_URL: postgres://stoerdesk:ci-stoerdesk@localhost:5432/stoerdesk

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners provide Docker; self-hosted ones might not.
      - name: Detect Docker
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          else
            echo 'available=false' >>"$GITHUB_OUTPUT"
            echo 'No usable Docker on this runner - skipping the smoke test.'
          fi

      - name: Smoke test
        if: steps.docker.outputs.available == 'true'
        run: sh scripts/docker-smoke.sh

  playwright:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:run --workspace @stoerdesk/web
