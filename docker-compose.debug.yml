# Optional override — direct access to the API from the host.
#
# The production stack never publishes an API host port; the web container
# proxies /api/ over the internal `backend` network. Use this override only
# for curl, monitoring or debugging:
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# The file name is deliberately not "docker-compose.override.yml": a deployment
# panel must never pick it up automatically.

services:
  api:
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PUBLISHED_PORT:-3000}:${API_PORT:-3000}'
