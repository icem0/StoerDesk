# Local override — kept for explicit local builds. The main compose file now
# defaults to the working tree, so this file is optional:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# The file name is deliberately not "docker-compose.override.yml": a deployment
# panel must never pick it up automatically.

services:
  api:
    build:
      context: .

  web:
    build:
      context: .
